name: CI/CD frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Verificar versión del runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1); console.log('Node.js ' + process.versions.node)"
      - name: Revisar sintaxis JavaScript
        run: |
          while IFS= read -r archivo; do
            node --check "$archivo"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Revisar estructura, rutas y versiones de dependencias
        run: node scripts/ci-check.mjs

  seguridad:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Obtener el repositorio y su historial
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar secretos en el código y el historial
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Inicializar CodeQL para JavaScript
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analizar vulnerabilidades del código
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript'

  publicar:
    name: Publicar en GitHub Pages
    needs: [validar, seguridad]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar el sitio
        run: |
          mkdir dist
          cp -r admin assets cliente controllers models views index.html dist/
          test -s dist/index.html
          echo "Archivos preparados: $(find dist -type f | wc -l)"
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Desplegar sitio
        id: deploy
        uses: actions/deploy-pages@v4
